name: Fetch Mi Fitness lab input

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-mifitness-lab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Mi Fitness 3.57.0i XAPK from APKPure public endpoint
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/com.xiaomi.wearable?versionCode=357000' \
            -o out/MiFitness_3.57.0i_APKPure.xapk
          ls -lh out/MiFitness_3.57.0i_APKPure.xapk
          sha256sum out/MiFitness_3.57.0i_APKPure.xapk | tee out/SHA256SUMS.txt
          file out/MiFitness_3.57.0i_APKPure.xapk
          unzip -l out/MiFitness_3.57.0i_APKPure.xapk | head -n 80 | tee out/archive-list.txt

      - name: Upload short-lived lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: mifitness-3.57.0i-lab-input
          path: out/
          retention-days: 1
          compression-level: 0
