name: Build Nivo Direct WatchDrip Service Injector

on:
  workflow_dispatch:
  push:
    branches:
      - test/nivo-xiaomi-sender
    paths:
      - .github/workflows/nivo-watchdrip-direct-service.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nivo-xiaomi-sender
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone Android base
        run: git clone --depth 1 https://github.com/miguelavh/Watchdrip-Xiaomi.git injector

      - name: Create direct WatchDrip service injector
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path("injector/app/build.gradle")
          s = p.read_text()
          start = s.find("    signingConfigs {")
          if start != -1:
              end = s.find("    defaultConfig {", start)
              s = s[:start] + s[end:]
          s = s.replace("            signingConfig signingConfigs.release\n", "")
          s = s.replace('applicationId "com.application.watch.watchdrip"',
                        'applicationId "com.nivo.watchdripdirect"')
          p.write_text(s)
          PY

          cat > injector/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.thatguysservice.huami_xdrip" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Nivo WatchDrip Direct"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WatchdripXiaomi">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > injector/app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="26dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="NIVO → WATCHDRIP DIRECT"
                  android:textStyle="bold"
                  android:textSize="23sp"
                  android:gravity="center"
                  android:layout_marginTop="36dp"/>

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Ready"
                  android:textIsSelectable="true"
                  android:textSize="15sp"
                  android:fontFamily="monospace"
                  android:layout_marginTop="22dp"
                  android:layout_marginBottom="28dp"/>

              <Button
                  android:id="@+id/check"
                  android:layout_width="match_parent"
                  android:layout_height="58dp"
                  android:text="CHECK WATCHDRIP+"/>

              <Button
                  android:id="@+id/send111"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="DIRECT 111"
                  android:textSize="19sp"
                  android:layout_marginTop="18dp"/>

              <Button
                  android:id="@+id/send222"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="DIRECT 222"
                  android:textSize="19sp"
                  android:layout_marginTop="12dp"/>

              <Button
                  android:id="@+id/send333"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="DIRECT 333"
                  android:textSize="19sp"
                  android:layout_marginTop="12dp"/>
          </LinearLayout>
          XML

          cat > injector/app/src/main/java/com/application/watch/watchdrip/MainActivity.java <<'JAVA'
          package com.application.watch.watchdrip;

          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private static final String WATCHDRIP_PACKAGE =
                  "com.thatguysservice.huami_xdrip";
              private static final String XIAOMI_SERVICE =
                  "com.thatguysservice.huami_xdrip.services.XiaomiWearService";

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  Button check = findViewById(R.id.check);
                  Button b111 = findViewById(R.id.send111);
                  Button b222 = findViewById(R.id.send222);
                  Button b333 = findViewById(R.id.send333);

                  check.setOnClickListener(v -> checkWatchDrip());
                  b111.setOnClickListener(v -> directSend("NIVO|111"));
                  b222.setOnClickListener(v -> directSend("NIVO|222"));
                  b333.setOnClickListener(v -> directSend("NIVO|333"));
              }

              private void checkWatchDrip() {
                  try {
                      getPackageManager().getPackageInfo(WATCHDRIP_PACKAGE, 0);
                      status.setText(
                          "WatchDrip+ package: FOUND\n" +
                          WATCHDRIP_PACKAGE + "\n" +
                          "Xiaomi service target:\n" + XIAOMI_SERVICE
                      );
                  } catch (PackageManager.NameNotFoundException e) {
                      status.setText(
                          "WatchDrip+ package: NOT FOUND\n" +
                          "Expected: " + WATCHDRIP_PACKAGE
                      );
                  }
              }

              private void directSend(String payload) {
                  Intent i = new Intent();
                  i.setComponent(new ComponentName(WATCHDRIP_PACKAGE, XIAOMI_SERVICE));
                  i.putExtra("FUNCTION", "update_bg");
                  i.putExtra("json", payload);

                  try {
                      ComponentName started;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          started = startForegroundService(i);
                      } else {
                          started = startService(i);
                      }

                      status.setText(
                          "Service start accepted ✅\n" +
                          "Target: " + (started == null ? "null" : started.flattenToShortString()) +
                          "\nPayload: " + payload +
                          "\n\nNow watch the band message counter."
                      );
                  } catch (Throwable t) {
                      status.setText(
                          "SERVICE START FAILED ❌\n" +
                          t.getClass().getSimpleName() + "\n" +
                          String.valueOf(t.getMessage())
                      );
                  }
              }
          }
          JAVA

      - name: Build APK
        working-directory: injector
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Publish APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/nivo-watchdrip-direct
          cp injector/app/build/outputs/apk/debug/app-debug.apk              test-artifacts/nivo-watchdrip-direct/Nivo_WatchDrip_Direct.apk
          sha256sum test-artifacts/nivo-watchdrip-direct/Nivo_WatchDrip_Direct.apk

          git pull --rebase origin test/nivo-xiaomi-sender
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-artifacts/nivo-watchdrip-direct/Nivo_WatchDrip_Direct.apk
          if ! git diff --cached --quiet; then
            git commit -m "test: publish direct WatchDrip Xiaomi service injector"
            git push origin HEAD:test/nivo-xiaomi-sender
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Nivo_WatchDrip_Direct
          path: test-artifacts/nivo-watchdrip-direct/Nivo_WatchDrip_Direct.apk
