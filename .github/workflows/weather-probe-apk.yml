name: Weather probe APK

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/weather-probe-apk.yml'

jobs:
  build-probe-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build weather probe debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload weather probe APK
        uses: actions/upload-artifact@v4
        with:
          name: BandDrip-weather-probe-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
