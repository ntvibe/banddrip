name: Vela build

on:
  pull_request:
    paths:
      - 'apps/band/**'
      - '.github/workflows/vela-build.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/band/**'
      - '.github/workflows/vela-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/band

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Vela tooling
        run: npm install

      - name: Verify emulator mock is disabled for committed builds
        run: node tools/assert-mock-off.mjs

      - name: Build RPK
        run: npm run build

      - name: Upload debug RPK
        uses: actions/upload-artifact@v4
        with:
          name: banddrip-vela-debug-rpk
          path: apps/band/dist/*.rpk
          if-no-files-found: error
