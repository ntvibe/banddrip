name: Publish BandDrip MVP Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/android
          gh run download 32577943869 --repo "$GITHUB_REPOSITORY" --name banddrip-all-in-one-debug-apk --dir dist/android

      - name: Download verified RPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/vela
          gh run download 32577943787 --repo "$GITHUB_REPOSITORY" --name banddrip-vela-debug-rpk --dir dist/vela

      - name: Normalize release files
        run: |
          APK="$(find dist/android -type f -name '*.apk' | head -n1)"
          RPK="$(find dist/vela -type f -name '*.rpk' | head -n1)"
          test -n "$APK" && test -n "$RPK"
          cp "$APK" dist/BandDrip-debug.apk
          cp "$RPK" dist/BandDrip-debug.rpk
          sha256sum dist/BandDrip-debug.apk dist/BandDrip-debug.rpk > dist/SHA256SUMS.txt
          ls -lh dist/BandDrip-debug.apk dist/BandDrip-debug.rpk dist/SHA256SUMS.txt

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-mvp --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0-mvp dist/BandDrip-debug.apk dist/BandDrip-debug.rpk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.1.0-mvp \
              dist/BandDrip-debug.apk \
              dist/BandDrip-debug.rpk \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target 355fc2717781ede38d12c24ebf79d2168162f1b1 \
              --title 'BandDrip v0.1.0 MVP' \
              --prerelease \
              --notes 'Hardware-free BandDrip MVP. Includes the verified Android all-in-one APK and Xiaomi Vela RPK from green CI at commit 355fc27. Physical Xiaomi Smart Band 10 install, transport, raise-to-wake and battery behavior remain experimental until validated on real hardware.'
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.1.0-mvp --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
