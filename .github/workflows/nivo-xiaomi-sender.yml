name: Nivo Xiaomi Transport V2

on:
  push:
    branches:
      - test/nivo-xiaomi-sender
    paths:
      - .github/workflows/nivo-xiaomi-sender.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/nivo-xiaomi-sender
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone Xiaomi wearable SDK sample
        run: git clone --depth 1 https://github.com/miguelavh/Watchdrip-Xiaomi.git sender

      - name: Convert sample into direct-send Nivo sender
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path("sender/app/build.gradle")
          s = p.read_text()
          start = s.find("    signingConfigs {")
          if start != -1:
              end = s.find("    defaultConfig {", start)
              s = s[:start] + s[end:]
          s = s.replace("            signingConfig signingConfigs.release\n", "")
          s = s.replace('applicationId "com.application.watch.watchdrip"', 'applicationId "com.nivo.transportsender"')
          p.write_text(s)
          PY

          cat > sender/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Nivo Transport Sender V2"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WatchdripXiaomi">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > sender/app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_horizontal"
              android:padding="28dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="NIVO TRANSPORT V2"
                  android:textStyle="bold"
                  android:textSize="25sp"
                  android:layout_marginTop="42dp"/>

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Connecting to Xiaomi wearable service…"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:layout_marginTop="22dp"
                  android:layout_marginBottom="28dp"/>

              <Button
                  android:id="@+id/send111"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="DIRECT SEND 111"
                  android:textSize="19sp"/>

              <Button
                  android:id="@+id/send222"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="DIRECT SEND 222"
                  android:textSize="19sp"
                  android:layout_marginTop="16dp"/>

              <Button
                  android:id="@+id/send333"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="DIRECT SEND 333"
                  android:textSize="19sp"
                  android:layout_marginTop="16dp"/>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Messages are sent immediately. Launch is attempted separately and never blocks sending. Target package on both phone and band: com.nivo.transportsender"
                  android:textSize="14sp"
                  android:gravity="center"
                  android:layout_marginTop="28dp"/>
          </LinearLayout>
          XML

          cat > sender/app/src/main/java/com/application/watch/watchdrip/MainActivity.java <<'JAVA'
          package com.application.watch.watchdrip;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Button;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.nio.charset.StandardCharsets;

          import test.invoke.sdk.XiaomiWatchHelper;

          public class MainActivity extends AppCompatActivity {
              private static final String BAND_PACKAGE = "com.nivo.transportsender";

              private XiaomiWatchHelper helper;
              private TextView status;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private int sendSequence = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  Button send111 = findViewById(R.id.send111);
                  Button send222 = findViewById(R.id.send222);
                  Button send333 = findViewById(R.id.send333);

                  send111.setEnabled(false);
                  send222.setEnabled(false);
                  send333.setEnabled(false);

                  helper = XiaomiWatchHelper.getInstance(this);
                  helper.setReceiver((id, message) ->
                      runOnUiThread(() -> status.setText(
                          "Band replied: " + new String(message, StandardCharsets.UTF_8)
                      ))
                  );

                  try {
                      helper.registerMessageReceiver();
                      handler.postDelayed(() -> {
                          status.setText("Ready. Keep Nivo Transport V2 open on the band, then send.");
                          send111.setEnabled(true);
                          send222.setEnabled(true);
                          send333.setEnabled(true);
                      }, 2200);
                  } catch (Throwable t) {
                      status.setText("Init failed: " + t.getClass().getSimpleName());
                  }

                  send111.setOnClickListener(v -> sendValue("111"));
                  send222.setOnClickListener(v -> sendValue("222"));
                  send333.setOnClickListener(v -> sendValue("333"));
              }

              private void sendValue(String value) {
                  final int seq = ++sendSequence;
                  final String payload = "NIVO|" + value;
                  status.setText("Sending " + payload + " directly…");

                  // Critical V2 change: message send is NOT gated by launchWearApp().
                  helper.sendMessageToWear(payload, sendStatus ->
                      runOnUiThread(() -> {
                          if (seq != sendSequence) return;
                          if (sendStatus.isSuccess()) {
                              status.setText("SEND callback SUCCESS: " + payload + " ✓  Check band counter.");
                          } else {
                              status.setText("SEND callback FAILED: " + payload);
                          }
                      })
                  );

                  // Launch is diagnostic only. Xiaomi may never return this callback
                  // for our native NuttX app, so it must never block message delivery.
                  handler.postDelayed(() -> {
                      try {
                          helper.launchApp(BAND_PACKAGE, launchStatus ->
                              runOnUiThread(() -> {
                                  if (seq != sendSequence) return;
                                  if (launchStatus.isSuccess()) {
                                      status.setText("Send requested; LAUNCH callback SUCCESS.");
                                  }
                              })
                          );
                      } catch (Throwable ignored) {}
                  }, 120);

                  handler.postDelayed(() -> {
                      if (seq == sendSequence && status.getText().toString().startsWith("Sending")) {
                          status.setText("No send callback yet — still check MESSAGE EVENTS on band.");
                      }
                  }, 2500);
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (helper != null) helper.unRegisterWatchHelper();
                  } catch (Throwable ignored) {}
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build sender APK
        working-directory: sender
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Create matching band installer V2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile

          src_b64 = Path("experiments/nivo-transport/Nivo_Transport_MB10Pro_3.201.016_UPLOAD.zip.b64")
          original = base64.b64decode(src_b64.read_text().strip())

          zin = zipfile.ZipFile(io.BytesIO(original), "r")
          files = {name: zin.read(name) for name in zin.namelist()}
          zin.close()

          target = "nivo_transport.bin"
          data = files[target]

          old = b"com.application.watch.watchdrip"
          new = b"com.nivo.transportsender"
          count = data.count(old)
          if count < 1:
              raise SystemExit("Expected old band package string not found in nivo_transport.bin")

          replacement = new + (b"\x00" * (len(old) - len(new)))
          data = data.replace(old, replacement)
          files[target] = data

          out = io.BytesIO()
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zout:
              for name, blob in files.items():
                  zout.writestr(name, blob)

          Path("Nivo_Transport_V2_MB10Pro_3.201.016_UPLOAD.zip").write_bytes(out.getvalue())
          print("Patched package-name occurrences:", count)
          print("Old:", old.decode())
          print("New:", new.decode())
          PY

      - name: Prepare outputs
        run: |
          cp sender/app/build/outputs/apk/debug/app-debug.apk Nivo_Transport_Sender_V2.apk
          sha256sum Nivo_Transport_Sender_V2.apk Nivo_Transport_V2_MB10Pro_3.201.016_UPLOAD.zip

      - name: Upload V2 test kit
        uses: actions/upload-artifact@v4
        with:
          name: Nivo_Transport_V2_Test_Kit
          path: |
            Nivo_Transport_Sender_V2.apk
            Nivo_Transport_V2_MB10Pro_3.201.016_UPLOAD.zip
          if-no-files-found: error

      - name: Publish V2 binaries to test branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/nivo-transport-v2
          cp Nivo_Transport_Sender_V2.apk test-artifacts/nivo-transport-v2/
          cp Nivo_Transport_V2_MB10Pro_3.201.016_UPLOAD.zip test-artifacts/nivo-transport-v2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-artifacts/nivo-transport-v2/
          if git diff --cached --quiet; then
            echo "No binary changes to publish."
          else
            git commit -m "test: publish Nivo transport V2 kit"
            git push origin HEAD:test/nivo-xiaomi-sender
          fi
