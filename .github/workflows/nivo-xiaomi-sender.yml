name: Nivo Xiaomi Direct Sender V21

on:
  push:
    branches:
      - test/nivo-xiaomi-sender
    paths:
      - .github/workflows/nivo-xiaomi-sender.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/nivo-xiaomi-sender
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone Xiaomi wearable SDK sample
        run: git clone --depth 1 https://github.com/miguelavh/Watchdrip-Xiaomi.git sender

      - name: Convert sample into direct sender for existing Nivo Transport app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path("sender/app/build.gradle")
          s = p.read_text()
          start = s.find("    signingConfigs {")
          if start != -1:
              end = s.find("    defaultConfig {", start)
              s = s[:start] + s[end:]
          s = s.replace("            signingConfig signingConfigs.release\n", "")
          # IMPORTANT: keep the original package identity so Xiaomi routes
          # messages to the already-installed Nivo Transport band app.
          s = s.replace('versionName "1.0"', 'versionName "2.1"')
          p.write_text(s)
          PY

          cat > sender/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Nivo Direct Sender 2.1"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WatchdripXiaomi">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > sender/app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_horizontal"
              android:padding="28dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="NIVO DIRECT 2.1"
                  android:textStyle="bold"
                  android:textSize="25sp"
                  android:layout_marginTop="42dp"/>

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Connecting to Xiaomi wearable service…"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:layout_marginTop="22dp"
                  android:layout_marginBottom="28dp"/>

              <Button
                  android:id="@+id/send111"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="SEND 111"
                  android:textSize="20sp"/>

              <Button
                  android:id="@+id/send222"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="SEND 222"
                  android:textSize="20sp"
                  android:layout_marginTop="16dp"/>

              <Button
                  android:id="@+id/send333"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="SEND 333"
                  android:textSize="20sp"
                  android:layout_marginTop="16dp"/>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Uses the same package identity as the existing Nivo Transport band app. Sending does NOT wait for automatic launch."
                  android:textSize="14sp"
                  android:gravity="center"
                  android:layout_marginTop="28dp"/>
          </LinearLayout>
          XML

          cat > sender/app/src/main/java/com/application/watch/watchdrip/MainActivity.java <<'JAVA'
          package com.application.watch.watchdrip;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Button;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.nio.charset.StandardCharsets;

          import test.invoke.sdk.XiaomiWatchHelper;

          public class MainActivity extends AppCompatActivity {
              private static final String BAND_PACKAGE = "com.application.watch.watchdrip";

              private XiaomiWatchHelper helper;
              private TextView status;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private int sendSequence = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  Button send111 = findViewById(R.id.send111);
                  Button send222 = findViewById(R.id.send222);
                  Button send333 = findViewById(R.id.send333);

                  send111.setEnabled(false);
                  send222.setEnabled(false);
                  send333.setEnabled(false);

                  helper = XiaomiWatchHelper.getInstance(this);
                  helper.setReceiver((id, message) ->
                      runOnUiThread(() -> status.setText(
                          "Band replied: " + new String(message, StandardCharsets.UTF_8)
                      ))
                  );

                  try {
                      helper.registerMessageReceiver();
                      handler.postDelayed(() -> {
                          status.setText("Ready. Open Nivo Transport on band, then press a button.");
                          send111.setEnabled(true);
                          send222.setEnabled(true);
                          send333.setEnabled(true);
                      }, 2200);
                  } catch (Throwable t) {
                      status.setText("Init failed: " + t.getClass().getSimpleName());
                  }

                  send111.setOnClickListener(v -> sendValue("111"));
                  send222.setOnClickListener(v -> sendValue("222"));
                  send333.setOnClickListener(v -> sendValue("333"));
              }

              private void sendValue(String value) {
                  final int seq = ++sendSequence;
                  final String payload = "NIVO|" + value;
                  status.setText("Direct sending " + payload + "…");

                  helper.sendMessageToWear(payload, sendStatus ->
                      runOnUiThread(() -> {
                          if (seq != sendSequence) return;
                          if (sendStatus.isSuccess()) {
                              status.setText("SEND SUCCESS: " + payload + " ✓  Check MESSAGE EVENTS.");
                          } else {
                              status.setText("SEND FAILED: " + payload);
                          }
                      })
                  );

                  // Diagnostic only. Never gate sending on this callback.
                  handler.postDelayed(() -> {
                      try {
                          helper.launchApp(BAND_PACKAGE, launchStatus -> {});
                      } catch (Throwable ignored) {}
                  }, 120);

                  handler.postDelayed(() -> {
                      if (seq == sendSequence && status.getText().toString().startsWith("Direct sending")) {
                          status.setText("No send callback yet — still check band MESSAGE EVENTS.");
                      }
                  }, 2500);
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (helper != null) helper.unRegisterWatchHelper();
                  } catch (Throwable ignored) {}
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build sender APK
        working-directory: sender
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare output
        run: |
          cp sender/app/build/outputs/apk/debug/app-debug.apk Nivo_Direct_Sender_2.1.apk
          sha256sum Nivo_Direct_Sender_2.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nivo_Direct_Sender_2.1
          path: Nivo_Direct_Sender_2.1.apk
          if-no-files-found: error

      - name: Publish APK to test branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/nivo-direct-v21
          cp Nivo_Direct_Sender_2.1.apk test-artifacts/nivo-direct-v21/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-artifacts/nivo-direct-v21/Nivo_Direct_Sender_2.1.apk
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: publish Nivo direct sender 2.1"
            git push origin HEAD:test/nivo-xiaomi-sender
          fi
