name: Nivo Xiaomi Status Diagnostic

on:
  push:
    branches:
      - test/nivo-xiaomi-sender
    paths:
      - .github/workflows/nivo-xiaomi-sender.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/nivo-xiaomi-sender
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone Xiaomi wearable SDK sample
        run: git clone --depth 1 https://github.com/miguelavh/Watchdrip-Xiaomi.git sender

      - name: Build diagnostic app source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sender/app/build.gradle")
          s = p.read_text()
          start = s.find("    signingConfigs {")
          if start != -1:
              end = s.find("    defaultConfig {", start)
              s = s[:start] + s[end:]
          s = s.replace("            signingConfig signingConfigs.release\n", "")
          s = s.replace('versionName "1.0"', 'versionName "2.2"')
          p.write_text(s)
          PY

          cat > sender/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Nivo Xiaomi Diagnostic"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WatchdripXiaomi">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > sender/app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="NIVO XIAOMI DIAGNOSTIC"
                      android:textStyle="bold"
                      android:textSize="24sp"
                      android:gravity="center"
                      android:layout_marginTop="30dp"/>

                  <Button
                      android:id="@+id/diagnose"
                      android:layout_width="match_parent"
                      android:layout_height="64dp"
                      android:text="RUN DIAGNOSTIC"
                      android:textSize="18sp"
                      android:layout_marginTop="28dp"/>

                  <Button
                      android:id="@+id/send111"
                      android:layout_width="match_parent"
                      android:layout_height="64dp"
                      android:text="DIRECT SEND 111"
                      android:textSize="18sp"
                      android:layout_marginTop="14dp"/>

                  <TextView
                      android:id="@+id/log"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Press RUN DIAGNOSTIC."
                      android:textIsSelectable="true"
                      android:textSize="16sp"
                      android:fontFamily="monospace"
                      android:layout_marginTop="24dp"/>
              </LinearLayout>
          </ScrollView>
          XML

          cat > sender/app/src/main/java/com/application/watch/watchdrip/MainActivity.java <<'JAVA'
          package com.application.watch.watchdrip;

          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import com.xiaomi.xms.wearable.BaseApi;
          import com.xiaomi.xms.wearable.Status;
          import com.xiaomi.xms.wearable.Wearable;
          import com.xiaomi.xms.wearable.auth.Permission;
          import com.xiaomi.xms.wearable.node.Node;

          import java.nio.charset.StandardCharsets;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private TextView log;
              private String nodeId;

              private String explain(int code) {
                  switch (code) {
                      case 0: return "SUCCESS";
                      case -1: return "CANCELLED";
                      case -2: return "TIMEOUT";
                      case -3: return "INTERRUPTED";
                      case -4: return "DISCONNECTED";
                      case -5: return "PACKAGE_NOT_INSTALLED";
                      case -6: return "SIGNATURE_VERIFY_FAILED";
                      case -7: return "PERMISSION_DENIED";
                      case -8: return "APP_NOT_INSTALLED";
                      default: return "UNKNOWN";
                  }
              }

              private void line(String s) {
                  runOnUiThread(() -> log.append(s + "\n"));
              }

              private void statusLine(String prefix, Status status) {
                  int code = status == null ? 999 : status.getCode();
                  line(prefix + ": " + code + " (" + explain(code) + ")");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  log = findViewById(R.id.log);
                  Button diagnose = findViewById(R.id.diagnose);
                  Button send111 = findViewById(R.id.send111);

                  diagnose.setOnClickListener(v -> runDiagnostic());
                  send111.setOnClickListener(v -> directSend());
              }

              private void runDiagnostic() {
                  log.setText("Android package: " + getPackageName() + "\n");
                  line("Band package target: com.application.watch.watchdrip");
                  line("Querying connected Xiaomi nodes...");

                  Wearable.getNodeApi(this).getConnectedNodes(new BaseApi.Callback<List<Node>>() {
                      @Override
                      public void onSuccess(List<Node> nodes) {
                          line("Connected nodes: " + nodes.size());
                          if (nodes.isEmpty()) {
                              line("No connected node. Stop here.");
                              return;
                          }

                          Node n = nodes.get(0);
                          nodeId = n.getId();
                          line("Node name: " + n.getName());
                          line("Node id: " + nodeId);

                          Wearable.getNodeApi(MainActivity.this)
                              .isWearAppInstalled("com.application.watch.watchdrip",
                                  new BaseApi.Callback<Boolean>() {
                                      @Override
                                      public void onSuccess(Boolean installed) {
                                          line("Band app installed: " + installed);
                                      }
                                      @Override
                                      public void onFailure(Status status) {
                                          statusLine("isWearAppInstalled FAILED", status);
                                      }
                                  });

                          Permission[] perms = new Permission[] {
                              Permission.DEVICE_MANAGER, Permission.NOTIFY
                          };
                          Wearable.getAuthApi(MainActivity.this)
                              .checkPermissions(nodeId, perms,
                                  new BaseApi.Callback<Boolean[]>() {
                                      @Override
                                      public void onSuccess(Boolean[] result) {
                                          line("DEVICE_MANAGER permission: " +
                                              (result.length > 0 ? result[0] : "missing"));
                                          line("NOTIFY permission: " +
                                              (result.length > 1 ? result[1] : "missing"));
                                      }
                                      @Override
                                      public void onFailure(Status status) {
                                          statusLine("checkPermissions FAILED", status);
                                      }
                                  });

                          Wearable.getNodeApi(MainActivity.this)
                              .launchWearApp(nodeId, "com.application.watch.watchdrip",
                                  status -> statusLine("LAUNCH result", status));
                      }

                      @Override
                      public void onFailure(Status status) {
                          statusLine("getConnectedNodes FAILED", status);
                      }
                  });
              }

              private void directSend() {
                  if (nodeId == null) {
                      line("SEND: run diagnostic first; no node id yet.");
                      return;
                  }
                  byte[] data = "NIVO|111".getBytes(StandardCharsets.UTF_8);
                  line("Sending NIVO|111 to node...");
                  Wearable.getMessageApi(this).sendMessage(nodeId, data,
                      status -> statusLine("SEND result", status));
              }
          }
          JAVA

      - name: Build APK
        working-directory: sender
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/nivo-xiaomi-diagnostic
          cp sender/app/build/outputs/apk/debug/app-debug.apk test-artifacts/nivo-xiaomi-diagnostic/Nivo_Xiaomi_Diagnostic_2.2.apk
          sha256sum test-artifacts/nivo-xiaomi-diagnostic/Nivo_Xiaomi_Diagnostic_2.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-artifacts/nivo-xiaomi-diagnostic/Nivo_Xiaomi_Diagnostic_2.2.apk
          if ! git diff --cached --quiet; then
            git commit -m "test: publish Xiaomi status diagnostic 2.2"
            git push origin HEAD:test/nivo-xiaomi-sender
          fi
