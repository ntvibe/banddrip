name: Fetch reverse-engineering tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-re-tools.yml'

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified tools
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -L --fail --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o out/jadx-1.5.6.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  out/jadx-1.5.6.zip' | sha256sum -c -
          curl -L --fail --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' -o out/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  out/apktool_3.0.3.jar' | sha256sum -c -
          curl -L --fail --retry 3 'https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar' -o out/uber-apk-signer-1.3.0.jar
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out
      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: mifitness-re-tools
          path: out/
          retention-days: 1
          compression-level: 0
