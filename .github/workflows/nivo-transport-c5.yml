name: Build Nivo Transport C5

on:
  workflow_dispatch:
  push:
    branches:
      - test/nivo-xiaomi-sender
    paths:
      - .github/workflows/nivo-transport-c5.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nivo-xiaomi-sender
          fetch-depth: 0

      - name: Install ARM toolchain
        shell: bash
        run: |
          set -e
          if ! command -v arm-none-eabi-gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
          fi

      - name: Clone native app framework
        run: git clone --depth 1 https://github.com/m0tral/MiWatchNativeApps.git native

      - name: Write Nivo Transport C5
        shell: bash
        run: |
          cat > native/mb10pro/nivo_transport_c5.c <<'C'
          #include <stdint.h>
          #include "platform/miwear_system.h"
          #include "common/miwear/app.h"
          #include "common/lvgl/control.h"
          #include "common/nuttx/syslog.h"

          #define LOG_TAG      "[nivo_transport_c5]"
          #define APP_TAG      "com.application.watch.watchdrip"
          #define APP_ID       0xC5u
          #define PAGE_ID      0x00u
          #define APP_ICON     "/data/nivo_transport_logo_112.png"

          static volatile unsigned g_message_events;
          static volatile unsigned g_app_signals;
          static lv_obj_t *g_msg_label;
          static lv_obj_t *g_sig_label;
          static void *g_ui_timer;
          static void *g_start_timer;

          static const char *const msg_text[] = {
              "MESSAGE EVENTS: 0", "MESSAGE EVENTS: 1", "MESSAGE EVENTS: 2",
              "MESSAGE EVENTS: 3", "MESSAGE EVENTS: 4", "MESSAGE EVENTS: 5",
              "MESSAGE EVENTS: 6+"
          };
          static const char *const sig_text[] = {
              "APP SIGNALS: 0", "APP SIGNALS: 1", "APP SIGNALS: 2",
              "APP SIGNALS: 3", "APP SIGNALS: 4+"
          };

          static unsigned cap(unsigned v, unsigned max) { return v > max ? max : v; }

          static char *transport_app_get_name(void)
          {
              return "Nivo Transport C5";
          }

          static int transport_app_on_signal(void)
          {
              g_app_signals++;
              return 0;
          }

          /*
           * Counter-only transport probe.
           * Deliberately ignores callback arguments until delivery is proven.
           * ARM AAPCS permits the callee to ignore extra register arguments.
           */
          static int transport_on_newdata(void)
          {
              g_message_events++;
              return 0;
          }

          static int transport_page_on_signal(void)
          {
              g_app_signals++;
              return 0;
          }

          static void ui_timer_cb(lv_timer_t *timer)
          {
              (void)timer;
              if (g_msg_label)
                  lv_label_set_text(g_msg_label, msg_text[cap(g_message_events, 6)]);
              if (g_sig_label)
                  lv_label_set_text(g_sig_label, sig_text[cap(g_app_signals, 4)]);
          }

          static int transport_page_on_create(void *page, lv_obj_t *root, void *data)
          {
              (void)page; (void)data;

              lv_obj_t *title = lv_label_create(root);
              lv_label_set_text(title, "NIVO TRANSPORT C5");
              lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 32);

              lv_obj_t *wait = lv_label_create(root);
              lv_label_set_text(wait, "WAITING FOR PHONE");
              lv_obj_align(wait, LV_ALIGN_TOP_MID, 0, 116);

              g_msg_label = lv_label_create(root);
              lv_label_set_text(g_msg_label, msg_text[cap(g_message_events, 6)]);
              lv_obj_align(g_msg_label, LV_ALIGN_TOP_MID, 0, 210);

              g_sig_label = lv_label_create(root);
              lv_label_set_text(g_sig_label, sig_text[cap(g_app_signals, 4)]);
              lv_obj_align(g_sig_label, LV_ALIGN_TOP_MID, 0, 290);

              lv_obj_t *hint = lv_label_create(root);
              lv_label_set_text(hint, "Open sender and press 111.");
              lv_obj_align(hint, LV_ALIGN_BOTTOM_MID, 0, -52);

              if (!g_ui_timer)
                  g_ui_timer = lv_timer_create(ui_timer_cb, 300, 0);
              return 0;
          }

          static int transport_page_on_destroy(void *page, lv_obj_t *root, void *data)
          {
              (void)page; (void)root; (void)data;
              if (g_ui_timer) {
                  lv_timer_delete(g_ui_timer);
                  g_ui_timer = 0;
              }
              g_msg_label = 0;
              g_sig_label = 0;
              return 0;
          }

          static miwear_app_t g_transport_app = {
              .proto_app = 0,
              .field_4   = 0,
              .name      = APP_TAG,
              .icon      = APP_ICON,
              .app_id    = APP_ID,
              .flags     = 0,
              .field_14  = 0,
              .field_18  = 0,
              .app_get_name = transport_app_get_name,
              .on_uninstall = 0,
              .field_24  = 0,
              .field_28  = 0,
              .field_2C  = 0,
              .field_30  = 0,
              .field_34  = 0,
              .on_signal = transport_app_on_signal,
              .field_3C  = 0,
          };

          static miwear_page_t g_transport_page = {
              .parent_descriptor = 0,
              .page_name         = "main",
              .page_id           = PAGE_ID,
              .app_id            = APP_ID,
              .flags             = 0,
              .scheduler_deadline = 0,
              .scheduler_priority = 0,
              .async_destroy_state = 0,
              .lifecycle_state   = 0,
              .layer             = 1,
              .page_kind         = 0,
              .activity_context  = 0,
              .root_object       = 0,
              .on_signal         = (void *)transport_page_on_signal,
              .runtime_default_56 = 0,
              .registry_prev     = 0,
              .registry_next     = 0,
              .runtime_parent    = 0,
              .on_create         = transport_page_on_create,
              .on_resume         = 0,
              .on_newdata        = (void *)transport_on_newdata,
              .on_start          = 0,
              .on_pause          = 0,
              .on_stop           = 0,
              .on_destroy        = transport_page_on_destroy,
              .on_back           = 0,
              .on_keyevent       = 0,
              .get_scroll_obj    = 0,
          };

          static void register_transport(void)
          {
              /* Fresh temporary app ID: install directly, no recovery path. */
              miwear_page_t *pages[] = { &g_transport_page };
              int install_rc = g_packagemanager_api->install(&g_transport_app, pages, 1);
              syslog(LOG_WARN, "%s install=%d\n", LOG_TAG, install_rc);

              /* Match the proven Repair build exactly: no set_hidden call. */
              int launcher_rc = app_launcher_add(APP_ID);
              syslog(LOG_WARN, "%s launcher=%d\n", LOG_TAG, launcher_rc);

          }

          static void start_timer_cb(lv_timer_t *timer)
          {
              (void)timer;
              if (g_start_timer) {
                  lv_timer_delete(g_start_timer);
                  g_start_timer = 0;
              }
              register_transport();
          }

          __attribute__((constructor)) int module_initialize(void)
          {
              syslog(LOG_WARN, "%s loaded\n", LOG_TAG);
              g_start_timer = lv_timer_create(start_timer_cb, 500, 0);
              return 0;
          }

          __attribute__((destructor, used)) static void module_uninitialize(void)
          {
              syslog(LOG_WARN, "%s unloaded\n", LOG_TAG);
          }
          C

      - name: Compile C5 ELF for firmware 3.201.016
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-gcc             -mcpu=cortex-m33 -mthumb -mfloat-abi=hard -mfpu=fpv5-sp-d16             -ffreestanding -fno-common -fno-builtin -nostdlib             -fno-jump-tables -fno-stack-protector -fno-unwind-tables             -fno-asynchronous-unwind-tables -fdata-sections -fno-function-sections             -Os -I. -Imb10pro -DMB10P_FW_VERSION=3201016             -Wall -Wextra -Werror             -c mb10pro/nivo_transport_c5.c -o nivo_transport_c5.o

          arm-none-eabi-gcc             -mcpu=cortex-m33 -mthumb -mfloat-abi=hard -mfpu=fpv5-sp-d16             -r -T mb10pro/mb10pro.ld             -o nivo_transport_c5_3.201.016.elf nivo_transport_c5.o

          echo "C5 ELF size=$(stat -c%s nivo_transport_c5_3.201.016.elf)"
          arm-none-eabi-nm -u nivo_transport_c5_3.201.016.elf || true
          if arm-none-eabi-nm -u nivo_transport_c5_3.201.016.elf | grep -q '__aeabi_'; then
            echo "Unexpected __aeabi import"
            exit 1
          fi

      - name: Patch C5 into proven Nivo Transport watchface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf c5_work
          mkdir -p c5_work
          base64 -d experiments/nivo-transport/Nivo_Transport_MB10Pro_3.201.016_UPLOAD.zip.b64 > c5_work/original.zip
          unzip -q c5_work/original.zip -d c5_work/pkg

          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path("c5_work/pkg/nivo_transport.bin")
          data = bytearray(p.read_bytes())
          new = Path("native/nivo_transport_c5_3.201.016.elf").read_bytes()

          start = data.find(b"\x7fELF")
          if start < 0:
              raise SystemExit("Embedded ELF not found")

          e_shoff = struct.unpack_from("<I", data, start+32)[0]
          e_shentsize = struct.unpack_from("<H", data, start+46)[0]
          e_shnum = struct.unpack_from("<H", data, start+48)[0]
          maxend = 0
          for n in range(e_shnum):
              off = start + e_shoff + n*e_shentsize
              sh_type = struct.unpack_from("<I", data, off+4)[0]
              sh_offset = struct.unpack_from("<I", data, off+16)[0]
              sh_size = struct.unpack_from("<I", data, off+20)[0]
              if sh_type != 8:
                  maxend = max(maxend, sh_offset + sh_size)
          old_len = max(maxend, e_shoff + e_shentsize*e_shnum)

          print("old ELF slot:", old_len)
          print("C5 ELF:", len(new))
          if len(new) > old_len:
              raise SystemExit(f"C5 ELF {len(new)} exceeds slot {old_len}")

          data[start:start+old_len] = new + b"\x00" * (old_len-len(new))
          p.write_bytes(data)

          if b"nivo_transport_logo_112.png" not in data:
              raise SystemExit("logo lost")
          if b"local lvgl = require" not in data:
              raise SystemExit("Lua installer lost")
          print("container preserved:", len(data))
          PY

          cd c5_work/pkg
          zip -qr ../Nivo_Transport_C5_MB10Pro_3.201.016_UPLOAD.zip .
          cd ../..
          unzip -t c5_work/Nivo_Transport_C5_MB10Pro_3.201.016_UPLOAD.zip
          sha256sum c5_work/Nivo_Transport_C5_MB10Pro_3.201.016_UPLOAD.zip

      - name: Publish C5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/nivo-transport-c5
          cp c5_work/Nivo_Transport_C5_MB10Pro_3.201.016_UPLOAD.zip              test-artifacts/nivo-transport-c5/
          cp native/nivo_transport_c5_3.201.016.elf              test-artifacts/nivo-transport-c5/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-artifacts/nivo-transport-c5/
          if ! git diff --cached --quiet; then
            git commit -m "test: publish Nivo Transport C5 for 3.201.016"
            git push origin HEAD:test/nivo-xiaomi-sender
          fi

      - name: Upload C5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nivo_Transport_C5_3.201.016
          path: |
            c5_work/Nivo_Transport_C5_MB10Pro_3.201.016_UPLOAD.zip
            native/nivo_transport_c5_3.201.016.elf
