name: BandDrip native Mi Fitness installer
on:
  push:
    branches: ['hardware/pro-nfc-mifitness-native']
    paths: ['experiments/pro-nfc-mifitness-native/**', '.github/workflows/pro-nfc-mifitness-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build launcher DEX
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p out/classes out/artifact
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" -d out/classes experiments/pro-nfc-mifitness-native/BandDripNativeInstaller.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output out/artifact out/classes/BandDripNativeInstaller.class
          cp experiments/pro-nfc-mifitness-native/{open-installer.sh,README.md,BandDripNativeInstaller.java,UPSTREAM-LICENSE} out/artifact/
          bash -n out/artifact/open-installer.sh
          sha256sum out/artifact/classes.dex > out/artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BandDrip-MiFitness-native-installer
          path: out/artifact/
          if-no-files-found: error
