name: Pro NFC Face Probe

on:
  pull_request:
    paths:
      - 'experiments/pro-nfc-face-v1/**'
      - '.github/workflows/pro-nfc-face-build.yml'
  push:
    branches:
      - hardware/pro-nfc-v1
    paths:
      - 'experiments/pro-nfc-face-v1/**'
      - '.github/workflows/pro-nfc-face-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-face:
    runs-on: windows-latest
    steps:
      - name: Checkout BandDrip
        uses: actions/checkout@v5

      - name: Download EasyFace Gen2 Compiler v4.23
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\EasyFace_Gen2_CompilerV423.zip"
          $dir = "$env:RUNNER_TEMP\EasyFace423"
          Invoke-WebRequest -Uri 'https://github.com/m0tral/EasyFace/releases/download/v4.23/EasyFace_Gen2_CompilerV423.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $compiler = Get-ChildItem $dir -Recurse -Filter 'Compiler.exe' | Select-Object -First 1
          if (!$compiler) { throw 'EasyFace v4.23 Compiler.exe not found in release archive' }
          "COMPILER_PATH=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-FileHash $zip -Algorithm SHA256 | Format-List
          Write-Host "Compiler: $($compiler.FullName)"

      - name: Stage BandDrip Pro NFC project
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'BandDripProNfc'
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'images') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'output') | Out-Null
          Copy-Item -Recurse 'experiments\pro-nfc-face-v1\app' (Join-Path $stage 'app')
          $src = Get-Content 'experiments\pro-nfc-face-v1\BandDripProNfc.fprj' -Raw
          Set-Content -Path (Join-Path $stage 'BandDripProNfc.fprj') -Value $src -Encoding Unicode
          "PROJECT_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate 336x480 preview resource
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $path = Join-Path $env:PROJECT_DIR 'images\preview_rgba.png'
          $bmp = [System.Drawing.Bitmap]::new(336, 480)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Black)
          $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
          if (!(Test-Path $path)) { throw 'preview_rgba.png was not generated' }

      - name: Compile .face for DeviceType 567
        shell: pwsh
        run: |
          $project = Join-Path $env:PROJECT_DIR 'BandDripProNfc.fprj'
          $out = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $out | Out-Null
          Push-Location (Split-Path $env:COMPILER_PATH)
          try {
            & $env:COMPILER_PATH -b $project $out 'BandDrip-Pro-NFC-Probe-v1.face' '26082501'
            if ($LASTEXITCODE) { throw "Compiler.exe failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $face = Join-Path $out 'BandDrip-Pro-NFC-Probe-v1.face'
          if (!(Test-Path $face)) { throw 'Compiler completed but .face output is missing' }
          Get-FileHash $face -Algorithm SHA256 | Format-List
          Get-Item $face | Format-List Name,Length,LastWriteTime

      - name: Upload installable face
        uses: actions/upload-artifact@v4
        with:
          name: BandDrip-Pro-NFC-Probe-v1
          path: dist/BandDrip-Pro-NFC-Probe-v1.face
          if-no-files-found: error
