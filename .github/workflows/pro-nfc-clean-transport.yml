name: BandDrip clean transport probes

on:
  pull_request:
    paths:
      - 'experiments/pro-nfc-clean-transport/**'
      - '.github/workflows/pro-nfc-clean-transport.yml'
  push:
    branches:
      - hardware/pro-nfc-clean-transport
    paths:
      - 'experiments/pro-nfc-clean-transport/**'
      - '.github/workflows/pro-nfc-clean-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gadgetbridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Get pinned Gadgetbridge source
        run: |
          git clone --depth 1 --branch 0.93.0 https://codeberg.org/Freeyourgadget/Gadgetbridge.git gb
          python experiments/pro-nfc-clean-transport/gadgetbridge/patch.py gb
      - name: Install SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.1.0'
      - name: Build isolated diagnostic APK
        working-directory: gb
        run: ./gradlew :app:assembleMainlineDebug --stacktrace
      - name: Bundle corresponding source and build identity
        run: |
          git -C gb diff > gadgetbridge-diagnostics.patch
          git -C gb rev-parse HEAD > gadgetbridge-source-commit.txt
          tar --exclude=.git --exclude=build --exclude=.gradle -czf gadgetbridge-probe-source.tar.gz gb
      - uses: actions/upload-artifact@v4
        with:
          name: BandDrip-Gadgetbridge-P0
          path: |
            gb/app/build/outputs/apk/mainline/debug/*.apk
            gadgetbridge-diagnostics.patch
            gadgetbridge-source-commit.txt
            gadgetbridge-probe-source.tar.gz
          if-no-files-found: error
          retention-days: 30
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare EasyFace-compatible project
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'experiments\pro-nfc-clean-transport'
          $images = Join-Path $root 'images'
          $bin = Join-Path $root 'bin'
          $scratch = Join-Path $root 'output'
          New-Item -ItemType Directory -Force -Path $images, $bin, $scratch | Out-Null

          $fprj = Join-Path $root 'BandDripTransportP0.fprj'
          $xml = Get-Content -Raw -Path $fprj
          [System.IO.File]::WriteAllText($fprj, $xml, [System.Text.Encoding]::Unicode)

          # DeviceType 367 uses a 336x480 runtime canvas while EasyFace expects
          # a 230x328 gallery preview for this target.
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 230,328
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Black)
          $white = [System.Drawing.Brushes]::White
          $gray = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(142,142,147))
          $green = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(48,209,88))
          $blue = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(100,210,255))
          $big = New-Object System.Drawing.Font('Arial',42,[System.Drawing.FontStyle]::Bold)
          $mid = New-Object System.Drawing.Font('Arial',16,[System.Drawing.FontStyle]::Regular)
          $small = New-Object System.Drawing.Font('Arial',10,[System.Drawing.FontStyle]::Regular)
          $center = New-Object System.Drawing.StringFormat
          $center.Alignment = [System.Drawing.StringAlignment]::Center

          $g.DrawString('BANDDRIP P0',$small,$green,(New-Object System.Drawing.RectangleF 0,20,230,28),$center)
          $g.DrawString('112',$big,$white,(New-Object System.Drawing.RectangleF 0,62,175,70),$center)
          $g.DrawString('v',$mid,$white,(New-Object System.Drawing.RectangleF 160,82,45,38),$center)
          $g.DrawString('+6',$mid,$blue,(New-Object System.Drawing.RectangleF 22,150,62,34),$center)
          $g.DrawString('3m ago',$mid,$gray,(New-Object System.Drawing.RectangleF 108,150,102,34),$center)
          $g.DrawString('IOB 0.250 U',$mid,$gray,(New-Object System.Drawing.RectangleF 0,196,230,34),$center)
          $g.DrawString('10:24',$mid,$white,(New-Object System.Drawing.RectangleF 0,254,230,34),$center)

          $preview = Join-Path $images 'preview_rgba.png'
          $bmp.Save($preview,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose(); $gray.Dispose(); $green.Dispose(); $blue.Dispose(); $big.Dispose(); $mid.Dispose(); $small.Dispose(); $center.Dispose()

          Write-Host "Prepared $fprj"
          Write-Host "Prepared $preview"
          Write-Host "Preview size: 230x328"

      - name: Download community watchface compiler
        shell: powershell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'banddrip-watchface-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $compiler = Join-Path $tools 'Compiler.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/FangAiden/LuaDevTemplate/main/watchface/tools/Compiler.exe' -OutFile $compiler
          if (-not (Test-Path $compiler)) { throw 'Compiler download failed' }
          Write-Host "Compiler SHA256: $((Get-FileHash $compiler -Algorithm SHA256).Hash)"

      - name: Compile BandDripTransportP0.face
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'experiments\pro-nfc-clean-transport'
          $fprj = Join-Path $root 'BandDripTransportP0.fprj'
          $out = Join-Path $root 'bin'
          $compiler = Join-Path $env:RUNNER_TEMP 'banddrip-watchface-tools\Compiler.exe'
          $faceName = 'BandDripTransportP0.face'
          $faceId = '1909073001'

          & $compiler -b $fprj $out $faceName $faceId
          if ($LASTEXITCODE -ne 0) { throw "Compiler exited with $LASTEXITCODE" }

          $face = Join-Path $out $faceName
          if (-not (Test-Path $face)) { throw "Expected face not produced: $face" }
          if ((Get-Item $face).Length -lt 1024) { throw 'Compiled face is unexpectedly small' }
          Write-Host "FACE=$face"
          Write-Host "SIZE=$((Get-Item $face).Length)"
          Write-Host "SHA256=$((Get-FileHash $face -Algorithm SHA256).Hash)"

      - name: Upload installable watchface
        uses: actions/upload-artifact@v4
        with:
          name: BandDripTransportP0-face
          path: experiments/pro-nfc-clean-transport/bin/BandDripTransportP0.face
          if-no-files-found: error
          retention-days: 30
